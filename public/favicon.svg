<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mahmud">
  <!--
    The three-bar mark from the wordmark, on ink so it holds up against both
    light and dark browser chrome. Geometry matches components/MahmudLogo.tsx:
    bars are 30 wide on a 46 pitch, top edge 38 right of the bottom (~21°),
    authored in a 160x100 space and scaled into a 26x16.25 box here.
  -->
  <rect width="32" height="32" rx="7" fill="#16150f"/>
  <g transform="translate(3 7.875) scale(0.1625)" fill="#f4f3ef">
    <path d="M38 0 L68 0 L30 100 L0 100 Z"/>
    <path d="M84 0 L114 0 L76 100 L46 100 Z"/>
    <path d="M130 0 L160 0 L122 100 L92 100 Z"/>
  </g>
</svg>
